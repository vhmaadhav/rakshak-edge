# rbench registry: the models and datasets the benchmark harness knows about.
#
# Paths are relative to the bench root (~/rakshak-bench on the Pi). `source` is the
# repo-relative file that sync_bench.sh copies to `path` on the Pi (blank = not synced).
# `sha256` pins the file; a blank sha256 means "not pinned" (synthetic or unpinned).
# Sidecar files have their own laptop source: model `side_scaler_source` and
# `parity_logits_source`, extras[].source, dataset `split_source`. A blank source means the
# file is not synced from the laptop (sync_bench.sh skips it).
# Thresholds are decision thresholds on the probability score: score >= threshold is scam.
# Every disabled entry must say why in `notes`.

schema = "rbench-registry/1"

