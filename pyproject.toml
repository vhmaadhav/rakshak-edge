[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rakshak"
version = "0.1.0"
description = "Offline scam-SMS and embedded-URL detector with proof-carrying explanations (Bharat AI-SoC PS3)."
readme = "docs/CONTEXT.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "regex>=2024.5.15",
    "tldextract>=5.1",
    "lightgbm>=4.3",
    "pyarrow>=26.0.0",
    "datasketch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rakshak"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["deploy/pi"]
addopts = "-ra"
